name: Collecte et déploiement

on:
  schedule:
    - cron: '7 */2 * * *'      # toutes les 2 heures (UTC)
    - cron: '40 7,19 * * *'    # autour des changements de garde (≈ 8h40 et 20h40 au Maroc)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collecte des pharmacies de garde (toutes les villes des sources)
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run collect
      - name: Collecte des cliniques et hôpitaux
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run collect:sante
      - name: Enregistrer les données
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: collecte du $(TZ=Africa/Casablanca date '+%Y-%m-%d %H:%M') (heure du Maroc) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Construire
        env:
          BASE_PATH: /dabagarde/
          SITE_URL: https://milyasse.github.io/dabagarde
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
