name: Base géographique

# Régions, provinces et localités à partir de l'extraction OpenStreetMap du Maroc (Geofabrik, ODbL).
# Un téléchargement mensuel suffit : le découpage administratif change rarement.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1' # chaque lundi (base géographique + cliniques et hôpitaux)

permissions:
  contents: write

jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils (osmium)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
      - name: Extraction OpenStreetMap du Maroc (Geofabrik)
        run: |
          mkdir -p "$RUNNER_TEMP/osm"
          curl -fsSL --retry 3 -A "DabaGarde-geo/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
            -o "$RUNNER_TEMP/osm/morocco.osm.pbf" https://download.geofabrik.de/africa/morocco-latest.osm.pbf
          ls -lh "$RUNNER_TEMP/osm/morocco.osm.pbf"
      - name: Filtrer (limites administratives, lieux habités)
        run: |
          cd "$RUNNER_TEMP/osm"
          osmium tags-filter morocco.osm.pbf r/boundary=administrative n/place=city,town,village,suburb,quarter -o geo.osm.pbf --overwrite
          osmium export geo.osm.pbf -f geojsonseq -a type,id --geometry-types=point,polygon -o geo.geojsonseq --overwrite
          osmium tags-filter morocco.osm.pbf nwr/amenity=hospital,clinic nwr/healthcare=hospital,clinic -o sante.osm.pbf --overwrite
          osmium export sante.osm.pbf -f geojsonseq -a type,id --geometry-types=point,polygon -o sante.geojsonseq --overwrite
          osmium fileinfo -g header.option.osmosis_replication_timestamp morocco.osm.pbf > osm-base.txt || true
          ls -lh geo.geojsonseq sante.geojsonseq
      - name: Construire la base
        run: node --experimental-strip-types --no-warnings scripts/build-geo.ts "$RUNNER_TEMP/osm/geo.geojsonseq"
      - name: Cliniques et hôpitaux de tout le Maroc
        run: |
          node --experimental-strip-types --no-warnings scripts/osm-health.ts "$RUNNER_TEMP/osm/sante.geojsonseq" "$(cat $RUNNER_TEMP/osm/osm-base.txt 2>/dev/null)"
          npm run collect:sante
      - name: Enregistrer (données, ou au moins le rapport)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached data-sources/geo/contours data-sources/geo/places 2>/dev/null || true
          rm -rf data-sources/geo/contours data-sources/geo/places
          git add -A data-sources/geo; git add public/data/geo public/data/sante 2>/dev/null || true
          git commit -m "geo: base géographique du $(date -u +%Y-%m-%d) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
