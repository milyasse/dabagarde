name: Base géographique

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # le 1er de chaque mois

permissions:
  contents: write

jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire la base (OpenStreetMap, Overpass)
        run: node --experimental-strip-types --no-warnings scripts/build-geo.ts
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/data/geo data-sources/geo
          git commit -m "geo: base géographique du $(date -u +%Y-%m-%d) [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
